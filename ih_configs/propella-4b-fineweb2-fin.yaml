formation to redundancy, padding, and repetition","enum":["dense","adequate","moderate","thin","empty"],"title":"InformationDensity","type":"string"},"content_quality":{"description":"Overall quality considering writing excellence, substantive value, and presentation","enum":["excellent","good","adequate","poor","unacceptable"],"title":"ContentQuality","type":"string"},"audience_level":{"description":"Intended sophistication level and background knowledge assumptions","enum":["expert","advanced","general","beginner","youth","children"],"title":"AudienceLevel","type":"string"},"commercial_bias":{"description":"How much commercial interests influence objectivity and informational value","enum":["none","minimal","moderate","heavy","pure_marketing"],"title":"CommercialBias","type":"string"},"time_sensitivity":{"description":"How time-sensitive the content is","enum":["evergreen","slowly_changing","regularly_updating","time_sensitive"],"title":"TimeSensitivity","type":"string"},"content_safety":{"description":"Presence of inappropriate, harmful, or legally problematic content","enum":["safe","mild_concerns","nsfw","harmful","illegal"],"title":"ContentSafety","type":"string"},"educational_value":{"description":"Potential for teaching, learning, and knowledge transfer","enum":["high","moderate","basic","minimal","none"],"title":"EducationalValue","type":"string"},"reasoning_indicators":{"description":"Presence and quality of logical reasoning, analysis, and explanatory content","enum":["analytical","explanatory","basic_reasoning","minimal","none"],"title":"ReasoningIndicators","type":"string"},"pii_presence":{"description":"Whether the content contains personally identifiable information","enum":["no_pii","contains_pii"],"title":"PiiPresence","type":"string"},"regional_relevance":{"description":"Primary regional, cultural, or geopolitical sphere(s) - always return an array (one or multiple regions)","items":{"description":"Primary regional, cultural, or geopolitical sphere(s)","enum":["european","north_american","east_asian","south_asian","southeast_asian","middle_eastern","sub_saharan_african","latin_american","oceanian","central_asian","russian_sphere","global","culturally_neutral","indeterminate"],"title":"RegionalRelevance","type":"string"},"maxItems":3,"minItems":1,"title":"Regional Relevance","type":"array"},"country_relevance":{"description":"Specific country/countries the content mentions or is relevant for (or special values for supranational/non-country-specific) - always return an array (one or more countries/special values)","items":{"anyOf":[{"description":"Country names for country relevance classification.\nBased on ISO 3166-1 standard - the authoritative international standard \nfor country codes maintained by the International Organization for Standardization.\n\nIncludes all 249 entities from ISO 3166-1: 193 UN member states, \n2 UN observer states, plus dependent territories and special areas.\n\nReferences:\n- https://en.wikipedia.org/wiki/List_of_ISO_3166_country_codes\n- https://en.wikipedia.org/wiki/List_of_countries_and_dependencies_by_area","enum":["afghanistan","albania","algeria","andorra","angola","antigua_and_barbuda","argentina","armenia","australia","austria","azerbaijan","bahamas","bahrain","bangladesh","barbados","belarus","belgium","belize","benin","bhutan","bolivia","bosnia_and_herzegovina","botswana","brazil","brunei","bulgaria","burkina_faso","burundi","cabo_verde","cambodia","cameroon","canada","central_african_republic","chad","chile","china","colombia","comoros","congo","congo_democratic_republic","cook_islands","costa_rica","croatia","cuba","cyprus","czech_republic","denmark","djibouti","dominica","dominican_republic","ecuador","egypt","el_salvador","equatorial_guinea","eritrea","estonia","eswatini","ethiopia","fiji","finland","france","gabon","gambia","georgia","germany","ghana","greece","grenada","guatemala","guinea","guinea_bissau","guyana","haiti","honduras","hungary","iceland","india","indonesia","iran","iraq","ireland","israel","italy","ivory_coast","jamaica","japan","jordan","kazakhstan","kenya","kiribati","north_korea","south_korea","kosovo","kuwait","kyrgyzstan","laos","latvia","lebanon","lesotho","liberia","libya","liechtenstein","lithuania","luxembourg","madagascar","malawi","malaysia","maldives","mali","malta","marshall_islands","mauritania","mauritius","mexico","micronesia","moldova","monaco","mongolia","montenegro","morocco","mozambique","myanmar","namibia","nauru","nepal","netherlands","new_zealand","nicaragua","niger","nigeria","niue","north_macedonia","norway","oman","pakistan","palau","palestine","panama","papua_new_guinea","paraguay","peru","philippines","poland","portugal","qatar","romania","russia","rwanda","saint_kitts_and_nevis","saint_lucia","saint_vincent_and_the_grenadines","samoa","san_marino","sao_tome_and_principe","saudi_arabia","senegal","serbia","seychelles","sierra_leone","singapore","slovakia","slovenia","solomon_islands","somalia","south_africa","south_sudan","spain","sri_lanka","sudan","suriname","sweden","switzerland","syria","tajikistan","tanzania","thailand","timor_leste","togo","tonga","trinidad_and_tobago","tunisia","turkey","turkmenistan","tuvalu","uganda","ukraine","united_arab_emirates","united_kingdom","united_states","uruguay","uzbekistan","vanuatu","vatican_city","venezuela","vietnam","yemen","zambia","zimbabwe","aland_islands","american_samoa","anguilla","antarctica","aruba","ascension_island","bermuda","british_virgin_islands","cayman_islands","christmas_island","cocos_islands","curacao","falkland_islands","faroe_islands","french_guiana","french_polynesia","gibraltar","greenland","guadeloupe","guam","guernsey","hong_kong","isle_of_man","jersey","macau","martinique","mayotte","montserrat","new_caledonia","norfolk_island","northern_mariana_islands","pitcairn_islands","puerto_rico","reunion","saint_barthelemy","saint_helena","saint_martin","saint_pierre_and_miquelon","sint_maarten","svalbard_and_jan_mayen","t