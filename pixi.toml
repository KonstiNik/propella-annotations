[workspace]
channels = ["nvidia", "conda-forge"]
name = "inference-hive"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.12.*"

[pypi-dependencies]
loguru = ">=0.7.3"
pyyaml = ">=6.0.2"
pydantic = ">=2.11.7"
tqdm = ">=4.67.1"
huggingface-hub = ">=0.32.4"
datasets = ">=3.6.0"
transformers = ">=4.52.3"
openai = ">=1.86.0"
polars = ">=1.37.1, <2"
tabulate = ">=0.9.0"
hf-transfer = ">=0.1.9"

[feature.cpu]
platforms = ["linux-64"]

[feature.cpu.pypi-dependencies]
torch = {version = "==2.8.0", index="https://download.pytorch.org/whl/cpu"}

[feature.cpu.dependencies]
jupyter = ">=1.1.1,<2"

[feature.cuda-sglang.dependencies]
cuda-toolkit = "12.8.*"

[feature.cuda-sglang.activation.env]
# this is required on kisski
# CUDA_HOME = "$CONDA_PREFIX"
# cuda-toolkit provides stubs for linking (including libcuda.so stub)
# LIBRARY_PATH = "$CONDA_PREFIX/lib/stubs:$CONDA_PREFIX/targets/x86_64-linux/lib/stubs:$LIBRARY_PATH"
# LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$LD_LIBRARY_PATH"

# for leonardo use
# cuda-toolkit provides stubs for linking (including libcuda.so stub)
# Also include common system paths as fallback
LIBRARY_PATH = "$CONDA_PREFIX/lib/stubs:$CONDA_PREFIX/targets/x86_64-linux/lib/stubs:/usr/lib64:/usr/local/cuda/lib64/stubs:$LIBRARY_PATH"
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$LD_LIBRARY_PATH"

[feature.cuda-sglang.pypi-dependencies]
torch = {version = "==2.9.1", index="https://download.pytorch.org/whl/cu128"}
sglang = {version = "==0.5.7"}


[environments]
cpu = ["cpu"]
cuda-sglang = ["cuda-sglang"]
